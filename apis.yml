name: Tiney
description: 'Tiney is the UK''s fastest-growing Ofsted-approved childminder agency, connecting parents
  with quality-assured home childminders and supporting educators through training, registration, and
  ongoing quality assurance. Operating as a government-regulated Childminder Agency (CMA), tiney runs a
  consumer marketplace plus a mobile app for finding local childcare and managing payments, communication,
  and children''s learning updates. Tiney publishes no public developer API; its backend at api.tiney.co
  powers the parent and childminder apps and is access-restricted (HTTP 403) and undocumented.'
